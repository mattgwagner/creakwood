<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14112a">
<title>Creakwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Creepster&display=swap" rel="stylesheet">
<style>
:root{
  --night:#14112a;--ink:#2b1d10;--paper:#f6ebcf;--paper2:#efdfb8;--edge:#b08850;
  --lamp:#ffcf4a;--pumpkin:#f08a24;--plum:#5b3f8c;--moss:#4f8a4b;--red:#c8432f;
  --hd:Creepster,'Chalkduster',fantasy,cursive;--bd:Andika,'Atkinson Hyperlegible','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);font-family:var(--bd);color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--bd);color:inherit}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

/* hotspots and doors are real buttons laid over the canvas */
#spots{position:fixed;inset:0;pointer-events:none;z-index:5}
.spot{position:absolute;pointer-events:auto;background:transparent;border:0;border-radius:18px;cursor:pointer;padding:0}
.spot:focus-visible{outline:4px dashed var(--lamp)}
.spot .tag{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);width:max-content;max-width:min(190px,17vw);text-align:center;line-height:1.2;background:rgba(20,17,42,.85);color:#fff;border:3px solid var(--lamp);border-radius:12px;padding:4px 12px;font-size:clamp(15px,1.7vw,21px);font-weight:700}

/* HUD */
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:8;display:none;align-items:flex-start;gap:10px;pointer-events:none}
#hud.on{display:flex}
#hud .where{background:rgba(20,17,42,.8);color:#f3e6c4;border:3px solid #6a5a8a;border-radius:14px;padding:6px 14px;font-size:clamp(16px,1.8vw,22px);font-weight:700}
#hud .where small{display:block;font-weight:400;opacity:.8;font-size:.8em}
#hud .sp{flex:1}
.ico{pointer-events:auto;width:clamp(52px,5vw,64px);height:clamp(52px,5vw,64px);border-radius:50%;border:4px solid #2b1d10;background:var(--paper);font-size:clamp(22px,2.4vw,30px);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 4px 0 #0008}
.ico:active{transform:translateY(3px);box-shadow:none}

/* Wick's speech bubble */
#wick{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:none;max-width:min(860px,92vw);background:#fffaf0;border:4px solid var(--ink);border-radius:22px;padding:10px 16px 10px 72px;font-size:clamp(19px,2.1vw,25px);line-height:1.35;box-shadow:0 6px 0 #0007;align-items:center;gap:10px}
#wick.on{display:flex}
#wick.up{bottom:auto;top:calc(150px + env(safe-area-inset-top,0px))}
#wick .face{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:52px;height:64px}
#wick .txt{flex:1}
#wick .say{flex:none;width:46px;height:46px;font-size:22px;border-width:3px}

/* big context button (Hide / Freeze / Clue Board) */
#act{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;display:none;font-family:var(--hd);font-size:clamp(30px,3.6vw,46px);letter-spacing:2px;padding:10px 30px;border-radius:20px;border:5px solid var(--ink);background:var(--lamp);box-shadow:0 7px 0 #0008;cursor:pointer}
#act.on{display:block}
#act.warn{background:#ff7a5c;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}

/* door question banner */
#doorbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;display:none;width:min(900px,94vw);background:var(--paper);border:5px solid var(--ink);border-radius:18px;padding:10px 14px;box-shadow:0 6px 0 #0008;text-align:center}
#doorbar.on{display:block}
#doorbar .q{font-size:clamp(21px,2.4vw,29px);font-weight:700;line-height:1.3}
#doorbar .row{margin-top:6px}

/* generic overlay screens */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:16px;background:rgba(10,8,24,.62)}
.screen.on{display:flex}
.screen.clear{background:transparent}
.card{background:var(--paper);border:6px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 #0009;padding:clamp(16px,2.4vw,32px);max-width:min(960px,96vw);max-height:94vh;overflow:auto;text-align:center;position:relative}
h1.title{font-family:var(--hd);font-weight:400;font-size:clamp(64px,10vw,128px);margin:0;line-height:1;color:var(--lamp);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink),0 0 30px #ffcf4a66;letter-spacing:3px}
h2{font-family:var(--hd);font-weight:400;font-size:clamp(36px,4.6vw,58px);margin:4px 0 8px;letter-spacing:2px;line-height:1.05;color:var(--plum)}
h3{font-size:clamp(20px,2.2vw,27px);margin:16px 0 6px}
p{font-size:clamp(19px,2.1vw,26px);line-height:1.45;margin:10px auto;max-width:34em}
.btn{font-weight:700;font-size:clamp(21px,2.3vw,30px);background:var(--lamp);border:5px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:8px 26px;margin:8px;cursor:pointer;min-height:60px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.go{background:var(--pumpkin);color:#fff;text-shadow:0 2px 0 #0006}
.btn.sm{font-size:clamp(17px,1.8vw,22px);padding:5px 16px;min-height:50px;box-shadow:0 4px 0 var(--ink);border-width:4px}
.btn.on{background:#9be88f}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.small{font-size:clamp(15px,1.5vw,19px);color:#5a4a36}
.cases{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0}
.case{width:clamp(170px,19vw,230px);border:5px solid var(--ink);border-radius:16px;background:#fff8e6;padding:10px;cursor:pointer;box-shadow:0 5px 0 var(--ink);font-size:clamp(17px,1.8vw,21px)}
.case b{display:block;font-family:var(--hd);font-weight:400;font-size:clamp(24px,2.5vw,32px);letter-spacing:1px;color:var(--plum)}
.case.sel{background:#ffe9a3;outline:5px solid var(--pumpkin)}
.case.lock{opacity:.45;cursor:default}
.case .st{color:#d18b00;font-size:1.3em;letter-spacing:2px}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff88;pointer-events:none}

/* ---------- clue card ---------- */
#clue{position:fixed;inset:0;z-index:15;display:none;background:rgba(10,8,24,.72);padding:max(10px,env(safe-area-inset-top,0px)) 12px 12px;gap:12px;align-items:stretch;justify-content:center}
#clue.on{display:flex}
.paper{flex:1 1 640px;max-width:780px;display:flex;flex-direction:column;background:var(--paper);border:5px solid var(--ink);border-radius:10px;box-shadow:0 8px 0 #0009;min-width:0;position:relative}
.paper .lab{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:3px dashed var(--edge);font-size:clamp(16px,1.6vw,20px);color:#6b5032;font-weight:700}
.paper .lab span{flex:1}
.paper .lab .ico{width:50px;height:50px;font-size:22px;border-width:3px}
.text{flex:1;overflow:auto;padding:12px clamp(14px,2vw,28px) 24px;font-size:var(--fs,24px);line-height:1.5;-webkit-overflow-scrolling:touch}
.text .col{max-width:60ch;margin:0 auto}
.text .col+.col{margin-top:18px;padding-top:14px;border-top:4px double var(--edge)}
.text p{font-size:inherit;margin:0 0 .55em;max-width:none;line-height:inherit}
.text .h1{font-weight:700;font-size:1.22em;text-align:center;margin:.1em 0 .4em;letter-spacing:.5px}
.text .h2{font-weight:700;font-style:italic;text-align:center;margin:0 0 .5em}
.text .cap{font-style:italic;font-size:.88em;color:#4b3a26;text-align:center;margin:0 0 .7em}
.text table{border-collapse:collapse;margin:.2em auto .8em;font-size:.92em}
.text th,.text td{border:3px solid var(--ink);padding:.2em .55em;text-align:left}
.text th{background:var(--paper2)}
.text .rowu td{background:#fffaf0}
.text .pic{display:block;margin:0 auto .3em;width:min(320px,80%);height:auto;border:3px solid var(--ink);border-radius:6px;background:#ddd}
.k-news .h1{font-family:Georgia,'Times New Roman',serif;font-size:1.4em;border-bottom:4px double var(--ink);padding-bottom:.15em}
.k-diary .text,.k-notebook .text{background:repeating-linear-gradient(transparent 0 calc(1.5em - 2px),#c9b48a calc(1.5em - 2px) 1.5em);background-attachment:local}
.k-sign .text .h1,.k-poster .text .h1{color:var(--red)}
.u{border-radius:6px;transition:background .2s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.w{cursor:pointer;border-radius:4px}
.w.said{background:#ffe27a}
.vocab{text-decoration:underline 3px;text-underline-offset:4px;font-weight:700}
.u.look{background:#fff1a8;box-shadow:0 0 0 3px #f2c94c}
.u.proof{background:#b9f0a9;box-shadow:0 0 0 3px #4fae49}
.u.wrongpick{background:#ffc4bb;box-shadow:0 0 0 3px #d9534f}
.pick .u{cursor:pointer;background:#fff7dd;box-shadow:0 0 0 2px #e2cf9f;padding:0 .08em}
.pick .u.sel{background:#ffd76a;box-shadow:0 0 0 4px var(--pumpkin)}
.map{position:relative;margin:0 auto .8em;width:100%;max-width:600px;aspect-ratio:2/1;border:3px solid var(--ink);border-radius:6px;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .u{position:absolute;font-size:clamp(13px,1.6vw,19px);font-weight:700;background:#fff8e8e6;padding:1px 6px;border:2px solid var(--ink);border-radius:6px;white-space:nowrap;line-height:1.3}

.qpanel{flex:0 1 440px;display:flex;flex-direction:column;background:#fffaf0;border:5px solid var(--ink);border-radius:16px;box-shadow:0 8px 0 #0009;padding:12px;overflow:auto;min-width:0}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qhead .tagl{font-size:clamp(14px,1.4vw,17px);font-weight:700;color:#7a5d9e;text-transform:uppercase;letter-spacing:1px}
.qtext{flex:1;font-size:clamp(20px,2.1vw,26px);font-weight:700;line-height:1.35}
.qhead .ico{width:50px;height:50px;font-size:22px;border-width:3px;flex:none}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{text-align:left;font-size:clamp(19px,2vw,24px);line-height:1.3;background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;cursor:pointer;min-height:58px;font-weight:700}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.opt.right{background:#9be88f}
.opt.wrong{background:#ffb3a8;text-decoration:line-through;opacity:.75}
.opt:disabled{cursor:default}
.opt .n{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--plum);color:#fff;margin-right:8px;font-size:.85em}
.qmsg{min-height:1.4em;margin-top:10px;font-size:clamp(17px,1.8vw,22px);font-weight:700;color:#6b3fa0}
.qfoot{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stars-row{font-size:clamp(18px,1.8vw,22px);color:#8a6a2a}

/* ---------- clue board ---------- */
#board{position:fixed;inset:0;z-index:14;display:none;padding:max(10px,env(safe-area-inset-top,0px)) 14px 14px;background:#4a2f1d;background-image:radial-gradient(#5d3c25 15%,transparent 16%),radial-gradient(#3f2717 15%,transparent 16%);background-size:22px 22px;background-position:0 0,11px 11px;overflow:auto}
#board.on{display:flex;flex-direction:column;align-items:center}
#board .bq{background:var(--paper);border:5px solid var(--ink);border-radius:16px;padding:10px 18px;max-width:980px;width:100%;box-shadow:0 6px 0 #0009;text-align:center}
#board .bq .qtext{text-align:center}
.pins{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:14px 0;max-width:1100px}
.pin{position:relative;width:clamp(170px,18vw,205px);min-height:150px;background:#fffbe9;border:4px solid var(--ink);padding:24px 10px 10px;cursor:pointer;box-shadow:0 6px 0 #0008;font-size:clamp(17px,1.7vw,21px);font-weight:700;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pin:nth-child(odd){transform:rotate(-2deg)}.pin:nth-child(even){transform:rotate(1.6deg)}
.pin::before{content:'';position:absolute;top:6px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--red);box-shadow:0 2px 0 #0007}
.pin .k{font-size:30px;line-height:1}
.pin .st{color:#d18b00}
.pin.sel{background:#ffe08a;outline:6px solid var(--red)}
.pin.proof{background:#b9f0a9;outline:6px solid #3e9a3a}
.pin .read{margin-top:auto;font-size:16px;padding:3px 12px;min-height:40px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
.sus{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.sus .opt{min-width:min(420px,90vw);text-align:center}

/* grown-ups */
.adult{text-align:left;width:min(980px,96vw)}
.adult h2{text-align:center}
.skillrow{display:grid;grid-template-columns:minmax(150px,1.2fr) 3fr 140px;gap:10px;align-items:center;margin:6px 0;font-size:clamp(16px,1.6vw,20px)}
.bar{height:22px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss)}
.bar i.lo{background:var(--red)}.bar i.mid{background:var(--pumpkin)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:4px solid var(--ink);border-radius:14px;background:#fff;padding:6px 14px;font-size:clamp(16px,1.6vw,20px);cursor:pointer;font-weight:700;min-height:50px}
.chip small{display:block;font-weight:400;font-size:.8em}
.chip.on{background:#ffe08a;outline:4px solid var(--pumpkin)}
.players{display:grid;gap:10px;width:min(560px,100%);margin:0 auto}
.player{display:flex;gap:8px;align-items:center;border:4px solid var(--ink);border-radius:14px;background:#fff;padding:6px}
.player.on{background:#ffe9a3}
.player .who{flex:1;text-align:left;font-size:22px;font-weight:700;background:none;border:0;cursor:pointer;padding:6px}
.player .who small{display:block;font-weight:400;font-size:15px}
.player input{flex:1;font-size:22px;font-family:var(--bd);border:3px solid var(--ink);border-radius:10px;padding:6px 10px}
.coats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.coat{width:52px;height:52px;border-radius:50%;border:4px solid var(--ink);cursor:pointer}
.coat.on{outline:5px solid var(--plum);outline-offset:2px}
.tricky{font-size:clamp(15px,1.5vw,18px);line-height:1.5}
.tricky li{margin:4px 0}
.stars{font-size:clamp(54px,7vw,92px);letter-spacing:8px;color:#e0a100;text-shadow:0 4px 0 var(--ink)}
.stars .off{color:#0003;text-shadow:none}
.unmask-card{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(900px,94vw);z-index:12;display:none}
.unmask-card.on{display:block}
.unmask-card p{font-size:clamp(20px,2.2vw,27px);margin:6px auto}
@media (max-width:900px){
  #clue{flex-direction:column;overflow:auto}
  .paper{flex:0 0 auto;max-height:58vh;max-width:none}
  .qpanel{flex:0 0 auto;max-width:none}
}
@media (prefers-reduced-motion:reduce){#act.warn{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Creakwood"></canvas>
<div id="spots"></div>

<div id="hud"><div class="where" id="where"></div><div class="sp"></div><button class="ico" id="boardBtn" title="Clue Board" aria-label="Clue Board" style="display:none">📌</button><button class="ico" id="menuBtn" title="Menu" aria-label="Menu">⏸</button></div>
<div id="wick" role="status"><canvas class="face" id="wickFace" width="52" height="64"></canvas><div class="txt" id="wickTxt"></div><button class="ico say" id="wickSay" aria-label="Read it to me">🔊</button></div>
<button id="act"></button>
<div id="doorbar"><div class="q" id="doorQ"></div><div class="row"><button class="btn sm" id="doorSay" aria-label="Read the question">🔊</button><button class="btn sm" id="doorRead">📜 Read it again</button></div></div>

<div id="clue" role="dialog" aria-modal="true">
  <div class="paper" id="paper">
    <div class="lab"><span id="clueLab"></span><button class="ico" id="readAll" title="Read it to me" aria-label="Read the whole passage">🔊</button></div>
    <div class="text" id="ptext"></div>
  </div>
  <div class="qpanel" id="qpanel"></div>
</div>

<div id="board"></div>
<div class="unmask-card card" id="unmaskCard"></div>

<div class="screen clear on" id="sTitle"><div class="card" style="margin-left:auto;margin-right:3vw;max-width:min(620px,94vw)">
  <h1 class="title">Creakwood</h1>
  <p style="margin-top:4px">A spooky reading mystery. Read every clue carefully. It's how you get through the night.</p>
  <div class="cases" id="caseRow"></div>
  <div class="row"><button class="btn go" id="startBtn">Start the case</button></div>
  <div class="row"><button class="btn sm" id="playerBtn">👤 Player</button><button class="btn sm hold" id="adultBtn" aria-label="Grown-ups: press and hold">Grown-ups (hold)<i></i></button></div>
  <div class="small" id="titleInfo"></div>
</div></div>

<div class="screen" id="sIntro"><div class="card">
  <div class="small" id="introCap"></div>
  <h2 id="introTitle"></h2>
  <p id="introText"></p>
  <div class="row"><button class="btn sm" id="introSay" aria-label="Read it to me">🔊</button><button class="btn go" id="introGo">Light the lantern</button></div>
</div></div>

<div class="screen" id="sMenu"><div class="card">
  <h2>Paused</h2>
  <div class="row"><button class="btn go" id="resumeBtn">Keep going</button></div>
  <div class="row"><button class="btn sm" id="soundBtn">Sound: on</button><button class="btn sm" id="quitBtn">Back to the title</button></div>
  <p class="small">Your case is saved. You can come back to it later.</p>
</div></div>

<div class="screen" id="sPlayers"><div class="card" id="playersCard"></div></div>
<div class="screen" id="sAdult"><div class="card adult" id="adultCard"></div></div>
<div class="screen" id="sDone"><div class="card" id="doneCard"></div></div>
<script id="cw-content">
'use strict';
/* =====================================================================
   CONTENT. Hand-written passages and questions. scripts/contentcheck.mjs
   reads this block, so keep it free of DOM code.

   Passage markup (one block per line):
     # Heading      ## Subheading     ~ caption     @map id     ---  (second note)
     | a | b | c    table header row (first row without a key)
     |{key} a | b   table row; the whole row is one tappable unit
     [[key|text]]   a keyed unit: questions point at keys (look = hint glow,
                    ev = sentences that prove the answer). Every key a
                    question uses must exist in the Level 1, 2 and 3 text.
     _word_         underlined vocabulary word
   Options: the right one starts with "*".
   ===================================================================== */
const SKILLS = {
  key_detail: 'Key details',
  main_idea: 'Main idea',
  sequence: 'Sequence',
  inference: 'Inference and character',
  cause_effect: 'Cause and effect',
  vocab: 'Vocabulary in context',
  text_features: 'Text features',
  author_purpose: "Author's purpose",
  compare: 'Compare two texts',
};
const LEVELS = { 1: { name: 'Level 1', grade: 'End of grade 2', min: 40, max: 80 }, 2: { name: 'Level 2', grade: 'Grade 3', min: 80, max: 150 }, 3: { name: 'Level 3', grade: 'Grade 4', min: 150, max: 220 } };

const MAPS = {
  rail: {
    w: 600, h: 300,
    svg: `<rect x="0" y="0" width="600" height="300" fill="#efe2bf"/>
      <path d="M330 0 C 350 80, 300 160, 340 300" stroke="#6fa3c8" stroke-width="34" fill="none"/>
      <g fill="#7f9c6b" opacity=".55"><circle cx="230" cy="215" r="26"/><circle cx="270" cy="250" r="30"/><circle cx="200" cy="262" r="22"/><circle cx="160" cy="232" r="18"/></g>
      <path d="M20 95 L 585 95" stroke="#3b2a1a" stroke-width="7" fill="none"/>
      <path d="M20 95 L 585 95" stroke="#efe2bf" stroke-width="2" stroke-dasharray="6 9" fill="none"/>
      <path d="M260 95 C 250 160, 170 170, 150 230" stroke="#3b2a1a" stroke-width="5" stroke-dasharray="11 7" fill="none"/>
      <rect x="296" y="83" width="80" height="24" fill="#a07a4a" stroke="#3b2a1a" stroke-width="3"/>

const SENT_SPLIT = /(?<=(?<!\b(?:Ms|Mr|Mrs|Dr|St))[.!?]["')]?)\s+(?=["'(A-Z0-9])/;

    const out = [], re = /\[\[(\w+)\|([\s\S]*?)\]\]/g;
    let last = 0, m;
    const plain = s => s.trim() && s.trim().split(SENT_SPLIT).forEach(t => t.trim() && out.push(addUnit(null, t.trim())));
    while ((m = re.exec(body))) { plain(body.slice(last, m.index)); out.push(addUnit(m[1], m[2].trim())); last = re.lastIndex; }
    plain(body.slice(last));
    return out;
  };

    const line = raw.trim();
    if (!line) continue;
    if (line === '---') { col++; sawHeader = false; blocks.push({ t: 'sep', col }); continue; }

      const id = line.slice(5).trim(), map = MAPS[id];
      blocks.push({ t: 'map', col, id, units: map.labels.map(l => Object.assign(addUnit(l.key, l.text), { x: l.x, y: l.y })) });
      continue;
    }
    if (line.startsWith('|')) {
      let rest = line.slice(1), key = null;
      const km = rest.match(/^\{(\w+)\}\s*/);
      if (km) { key = km[1]; rest = rest.slice(km[0].length); }
      const cells = rest.split('|').map(s => s.trim()).filter(Boolean);

      blocks.push({ t: 'row', col, cells, units: [addUnit(key, cells.join(', '))] });

    else if (line.startsWith('# ')) { t = 'h1'; body = line.slice(2); }
    else if (line.startsWith('~ ')) { t = 'cap'; body = line.slice(2); }

}

}
function gate(x, kind) {

function bump(skill, first) { const st = save.skills[skill] || (save.skills[skill] = { n: 0, ok: 0 }); st.n++; if (first) st.ok++; }

const PICS = {
  c1s4: `<svg class="pic" viewBox="0 0 320 170" role="img" aria-label="A baker holding up a big blue cake"><rect width="320" height="170" fill="#e9dcc0"/><rect x="80" y="70" width="170" height="70" rx="10" fill="#4fb0ff" stroke="#2b1d10" stroke-width="4"/><rect x="100" y="40" width="130" height="34" rx="8" fill="#6fc0ff" stroke="#2b1d10" stroke-width="4"/><circle cx="50" cy="70" r="22" fill="#f2c9a0" stroke="#2b1d10" stroke-width="4"/><rect x="28" y="92" width="44" height="60" rx="10" fill="#fff" stroke="#2b1d10" stroke-width="4"/><g fill="#fff"><circle cx="120" cy="90" r="3"/><circle cx="160" cy="110" r="3"/><circle cx="200" cy="95" r="3"/><circle cx="140" cy="55" r="3"/><circle cx="190" cy="60" r="3"/></g></svg>`,
  c3s5: `<svg class="pic" viewBox="0 0 320 170" role="img" aria-label="A clockmaker holding a tiny brass owl"><rect width="320" height="170" fill="#e2d6bc"/><circle cx="140" cy="60" r="30" fill="#f2c9a0" stroke="#2b1d10" stroke-width="4"/><rect x="100" y="92" width="80" height="78" rx="14" fill="#6a4a7a" stroke="#2b1d10" stroke-width="4"/><ellipse cx="215" cy="98" rx="12" ry="15" fill="#c9952e" stroke="#2b1d10" stroke-width="3"/><circle cx="210" cy="94" r="4" fill="#fff"/><circle cx="220" cy="94" r="4" fill="#fff"/><path d="M178 120 L205 110" stroke="#2b1d10" stroke-width="6" stroke-linecap="round"/></svg>`,
};
let PASS = null;    // { p, clue, sceneId }
function wordsHtml(text) {
  return text.split(/(\s+)/).map(tok => {
    if (!tok.trim()) return tok;
    const m = tok.match(/^([^A-Za-z0-9_]*)_([A-Za-z]+)_(.*)$/);
    if (m) return `${esc(m[1])}<span class="w vocab" data-w="${esc(m[2])}">${esc(m[2])}</span>${esc(m[3])}`;
    const clean = tok.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
    return clean ? `<span class="w" data-w="${esc(clean)}">${esc(tok)}</span>` : esc(tok);
  }).join('');
}
function renderPassage(clue, sceneId) {
  const lvl = save.settings.level || 2;
  const p = parsePassage(clue['l' + lvl]);
  PASS = { p, clue, sceneId };
  const cols = Array.from({ length: p.cols }, () => []);
  for (const b of p.blocks) if (b.t !== 'sep') cols[b.col].push(b);
  const unit = u => `<span class="u" data-u="${u.i}">${wordsHtml(u.text)}</span>`;
  const html = cols.map(bs => {
    let out = '', table = '';
    const flush = () => { if (table) { out += `<table>${table}</table>`; table = ''; } };
    for (const b of bs) {
      if (b.t === 'th') { flush(); table = `<tr>${b.cells.map(c => `<th>${wordsHtml(c)}</th>`).join('')}</tr>`; continue; }
      if (b.t === 'row') { table += `<tr class="u rowu" data-u="${b.units[0].i}">${b.cells.map(c => `<td>${wordsHtml(c)}</td>`).join('')}</tr>`; continue; }
      flush();
      if (b.t === 'map') { const m = MAPS[b.id]; out += `<div class="map"><svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="none" aria-hidden="true">${m.svg}</svg>${b.units.map(u => `<span class="u" data-u="${u.i}" style="left:${u.x}%;top:${u.y}%">${wordsHtml(u.text)}</span>`).join('')}</div>`; continue; }
      const inner = b.units.map(unit).join(' ');
      if (b.t === 'h1') out += `<div class="h1">${inner}</div>`;
      else if (b.t === 'h2') out += `<div class="h2">${inner}</div>`;
      else if (b.t === 'cap') out += `${PICS[sceneId] || ''}<div class="cap">${inner}</div>`;
      else out += `<p>${inner}</p>`;
    }
    flush();
    return `<div class="col">${out}</div>`;
  }).join('');
  const t = $('ptext');
  t.innerHTML = html; t.scrollTop = 0;
  t.style.setProperty('--fs', ({ 1: '26px', 2: '24px', 3: '22px' })[lvl]);
  $('paper').className = 'paper k-' + clue.kind;
  $('clueLab').textContent = clue.label;
  $('readAll').style.display = save.settings.readAloud ? '' : 'none';
}
const unitsFor = keys => [...$('ptext').querySelectorAll('.u')].filter(el => keys.includes(PASS.p.units[+el.dataset.u].key));
function glow(keys, cls = 'look') { const els = unitsFor(keys || []); els.forEach(el => el.classList.add(cls)); if (els[0]) els[0].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
function clearGlow() { $('ptext').querySelectorAll('.look,.proof,.wrongpick,.sel').forEach(el => el.classList.remove('look', 'proof', 'wrongpick', 'sel')); }
let pickHandler = null;
$('ptext').addEventListener('click', e => {

/* =====================================================================
   Questions

const qp = $('qpanel');
function qShell(tag, text, sayText) {
  qp.innerHTML = `<div class="qhead"><div style="flex:1"><div class="tagl">${esc(tag)}</div><div class="qtext">${esc(text)}</div></div><button class="ico" data-say aria-label="Read the question">🔊</button></div><div class="opts"></div><div class="qmsg" aria-live="polite"></div><div class="qfoot"></div>`;
  qp.querySelector('[data-say]').onclick = () => speak(sayText || text);
  return { opts: qp.querySelector('.opts'), msg: qp.querySelector('.qmsg'), foot: qp.querySelector('.qfoot') };
}
const LETTERS = 'ABCD';
function gotIt(foot, res, label = 'Got it') { const b = document.createElement('button'); b.className = 'btn sm go'; b.textContent = label; b.dataset.got = '1'; b.onclick = () => { SFX.tap(); res(); }; foot.appendChild(b); }

function askMC(q, tag) {
  return new Promise(res => {
    const opts = shuffle(q.opts.map(o => ({ t: o.replace(/^\*/, ''), right: o.startsWith('*') })));
    const ui = qShell(tag, q.q, q.q + ' ' + opts.map((o, i) => `${LETTERS[i]}: ${o.t}.`).join(' '));
    CUR = { id: q.id, type: 'mc', skill: q.skill, q: q.q, opts: opts.map(o => o.t), answer: opts.findIndex(o => o.right) };
    let tries = 0, done = false;
    opts.forEach((o, i) => {
      const b = document.createElement('button'); b.className = 'opt'; b.dataset.i = i;
      b.innerHTML = `<span class="n">${LETTERS[i]}</span>${esc(o.t)}`;
      b.onclick = () => {
        if (done || b.disabled) return;
        if (o.right) {
          done = true; b.classList.add('right'); SFX.ding(); if (tries === 0) record(q, true);
          ui.opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
          ui.msg.textContent = tries === 0 ? 'Yes! You read that carefully.' : 'Yes! That was it.';
          clearGlow(); later(900).then(() => res(tries === 0));
          return;
        }
        tries++; b.classList.add('wrong'); b.disabled = true; SFX.buzz();
        if (tries === 1) { record(q, false); ui.msg.textContent = '🕯️ ' + q.hint; glow(q.look); }
        else {
          done = true; ui.opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (opts[+x.dataset.i].right) x.classList.add('right'); });
          clearGlow(); glow(q.ev || q.look, 'proof');
          ui.msg.textContent = `It's "${opts[CUR.answer].t}"` + ((q.ev || q.look) ? ' The green part of the clue shows it.' : '');
          gotIt(ui.foot, () => { clearGlow(); res(false); });
        }
      };
      ui.opts.appendChild(b);
    });
  });
}

function askEvidence(q, tag) {
  return new Promise(res => {
    const prompt = q.evq || 'Part B: Tap the sentence that proves your answer.';
    const ui = qShell(tag, prompt.replace(/^Part B: /, ''), prompt);
    qp.querySelector('.tagl').textContent = 'Part B · find the proof';
    const right = unitsFor(q.ev).map(el => +el.dataset.u);
    CUR = { id: q.id, type: 'evidence', skill: q.skill, q: prompt, keys: q.ev, answer: right };
    $('ptext').classList.add('pick');
    let sel = null, tries = 0;
    const btn = document.createElement('button'); btn.className = 'btn sm go'; btn.textContent = 'This proves it ✔'; btn.disabled = true; btn.dataset.prove = '1';
    ui.foot.appendChild(btn);
    ui.msg.textContent = 'Tap a sentence in the clue, then tap the button.';
    const end = first => { pickHandler = null; $('ptext').classList.remove('pick'); res(first); };
    pickHandler = el => { if (sel) sel.classList.remove('sel'); sel = el; el.classList.add('sel'); btn.disabled = false; SFX.tap(); };
    btn.onclick = () => {
      if (!sel) return;
      const k = +sel.dataset.u;
      if (right.includes(k)) {
        sel.classList.remove('sel'); sel.classList.add('proof'); SFX.ding(); if (tries === 0) record(q, true, 'ev');
        btn.remove(); ui.msg.textContent = 'That sentence proves it. Nice detective work!';
        later(1100).then(() => { clearGlow(); end(tries === 0); });
        return;
      }
      tries++; SFX.buzz(); sel.classList.remove('sel'); sel.classList.add('wrongpick');
      const was = sel; sel = null; btn.disabled = true; setTimeout(() => was.classList.remove('wrongpick'), 900);
      if (tries === 1) { record(q, false, 'ev'); ui.msg.textContent = '🕯️ Close! Read your answer again, then find the sentence that says the same thing in different words.'; }
      else {
        btn.remove(); pickHandler = null; $('ptext').classList.remove('pick');
        glow(q.ev, 'proof'); ui.msg.textContent = 'This is the sentence that proves it. It is lit up in green.';
        gotIt(ui.foot, () => { clearGlow(); res(false); });
      }
    };
  });
}

function askOrder(q, tag) {
  return new Promise(res => {
    const items = shuffle(q.items.map((t, i) => ({ t, i })));
    const ui = qShell(tag, q.q, q.q + ' ' + items.map(o => o.t).join(' '));
    CUR = { id: q.id, type: 'order', skill: q.skill, q: q.q, items: items.map(o => o.t), answer: q.items.map((_, k) => items.findIndex(o => o.i === k)) };
    let picked = [], tries = 0, done = false;
    const btns = items.map((o, i) => {
      const b = document.createElement('button'); b.className = 'opt'; b.dataset.i = i;
      const paint = () => { const n = picked.indexOf(i); b.innerHTML = `<span class="n" style="${n < 0 ? 'background:#bbb' : ''}">${n < 0 ? '?' : n + 1}</span>${esc(o.t)}`; };
      b.paint = paint; paint();
      b.onclick = () => {
        if (done || picked.includes(i)) return;
        picked.push(i); SFX.tap(); btns.forEach(x => x.paint());
        if (picked.length < items.length) return;
        const ok = picked.every((p, k) => items[p].i === k);
        if (ok) { done = true; SFX.ding(); btns.forEach(x => x.classList.add('right')); if (tries === 0) record(q, true); ui.msg.textContent = 'Yes! That is the right order.'; later(1000).then(() => res(tries === 0)); return; }
        tries++; SFX.buzz();
        if (tries === 1) { record(q, false); ui.msg.textContent = '🕯️ ' + q.hint; btns.forEach(x => x.classList.add('wrong')); setTimeout(() => { picked = []; btns.forEach(x => { x.classList.remove('wrong'); x.paint(); }); }, 900); }
        else { done = true; picked = CUR.answer.slice(); btns.forEach(x => { x.paint(); x.classList.add('right'); }); ui.msg.textContent = 'Here is the right order. Read it top to bottom.'; gotIt(ui.foot, () => res(false)); }
      };
      ui.opts.appendChild(b);
      return b;
    });
    const reset = document.createElement('button'); reset.className = 'btn sm'; reset.textContent = '↺ Start over';
    reset.onclick = () => { if (done) return; picked = []; btns.forEach(x => x.paint()); };
    ui.foot.appendChild(reset);
  });
}

async function ask(q, tag) {
  if (q.type === 'order') { const r = await askOrder(q, tag); CUR = null; return r; }
  const a = await askMC(q, q.ev ? tag + ' · Part A' : tag);
  CUR = null;
  if (!q.ev) return a;
  const b = await askEvidence(q, tag);
  CUR = null;
  return a && b;
}

function showClue(scene) { renderPassage(scene.clue, scene.id); $('clue').classList.add('on'); SFX.page(); wickHide(); }
function hideClue() { $('clue').classList.remove('on'); pickHandler = null; CUR = null; hush(); }
function readOnly(scene, keys) {
  return new Promise(res => {
    showClue(scene); if (keys) glow(keys);
    const ui = qShell('Clue', scene.clue.title, scene.clue.title);
    ui.msg.textContent = 'Tap any word to hear it.';
    gotIt(ui.foot, () => { hideClue(); res(); }, 'Done reading');
  });
}

async function runClue(scene) {
  S.mode = 'card'; showClue(scene);
  const core = shuffle(scene.clue.qs.filter(q => !q.extra));
  let all = true;
  for (let i = 0; i < core.length; i++) if (!(await ask(core[i], `Question ${i + 1} of ${core.length}`))) all = false;
  const ex = scene.clue.qs.find(q => q.extra && RUN.due.includes(q.skill));
  if (ex) { RUN.due.splice(RUN.due.indexOf(ex.skill), 1); await ask(ex, 'Bonus question'); }
  RUN.star[scene.id] = all;
  await new Promise(res => {
    const ui = qShell('Clue earned', `"${scene.clue.title}" goes on your Clue Board!`);
    ui.msg.textContent = all ? '⭐ Every answer right on the first try!' : 'You can reread it any time on the Clue Board.';
    SFX.pin(); gotIt(ui.foot, res, 'Pin it 📌');

function spotList() {

  for (const [id, b] of Object.entries(a.spots)) {

    else if (id === 'exit') out.push({ id, kind: 'exit', b });

  }
  if (a.doors) for (const o of sc.doors.opts) out.push({ id: 'door:' + o.id, kind: 'door', b: SPOT(a.doors[o.id], FLOOR - DOOR_H / 2, DOOR_W + 20, DOOR_H), label: o.label, door: o });

function walkTo(x, then) { WORLD.tx = clamp(x, 90, W - 90); WORLD.pending = then || null; }
function onSpot(s) {
  if (WORLD.busy || S.mode !== 'explore') return;
  if (WORLD.hidden || WORLD.hiding) return;
  SFX.tap();
  const x = s.kind === 'look' || s.kind === 'clue' ? s.b.x - 60 : s.b.x;
  if (s.kind === 'clue') return walkTo(x, () => WORLD.earned ? (calmCreature(), S.mode = 'card', readOnly(WORLD.sc).then(() => { S.mode = 'explore'; layoutSpots(); })) : openSceneClue());

  }
  if (s.kind === 'door') {

  }
}

async function chooseDoor(o) {

  if (o.right) {

async function scare(doorId) {

    CUR = { id: `c${c.id}-finale`, type: 'finale', q: f.q, opts: opts.map(o => o.label), answer: opts.findIndex(o => o.right) };

    $('bSay').onclick = () => speak($('bQ').textContent);
    CUR = { id: `c${c.id}-proof`, type: 'proof', answer: right.slice().sort() };
    let sel = [], tries = 0, done = false;
    const go = document.createElement('button'); go.className = 'btn go'; go.textContent = 'These prove it! 📌'; go.disabled = true; go.dataset.prove = '1'; foot.innerHTML = ''; foot.appendChild(go);

function toTitle() {
  hideClue(); $('board').classList.remove('on'); $('unmaskCard').classList.remove('on'); $('doorbar').classList.remove('on'); setAct(null); wickHide();
  S.mode = 'title'; RUN = null; WORLD = W0(); layoutSpots(); updHud(); refreshTitle(); screen('sTitle');
}
function refreshTitle() {
  if (!save.sel || save.sel > (save.unlocked || 1)) save.sel = save.unlocked || 1;
  $('caseRow').innerHTML = CASES.map(c => {
    const lock = c.id > (save.unlocked || 1), st = save.solved[c.id] || 0;
    return `<button class="case ${c.id === save.sel ? 'sel' : ''} ${lock ? 'lock' : ''}" data-case="${c.id}" ${lock ? 'disabled aria-disabled="true"' : ''}><span class="small">Case ${c.id}</span><b>${esc(c.title)}</b>${lock ? `🔒 Solve Case ${c.id - 1} first` : st ? `<span class="st">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</span>` : 'New!'}</button>`;
  }).join('');
  $('caseRow').querySelectorAll('[data-case]').forEach(b => b.onclick = () => { if (b.disabled) return; SFX.tap(); save.sel = +b.dataset.case; persist(); refreshTitle(); });
  const run = save.run;
  $('startBtn').textContent = run && run.c === save.sel - 1 ? `Continue (clue ${Math.min(5, run.clues.length + 1)} of 5)` : 'Start the case';
  const pl = curPlayer();
  $('playerBtn').textContent = `👤 ${playerName(pl)} · switch`;
  $('titleInfo').textContent = `Reading ${LEVELS[save.settings.level].name} (${LEVELS[save.settings.level].grade}). Grown-ups can change it.`;
}
$('startBtn').onclick = () => { ac(); SFX.tap(); const run = save.run; if (run && run.c === save.sel - 1) return resumeCase(); openIntro(save.sel); };
function openIntro(id) {
  const c = CASES[id - 1];
  $('introCap').textContent = `Case ${c.id} of ${CASES.length}`; $('introTitle').textContent = c.title; $('introText').textContent = c.intro;
  $('introSay').onclick = () => speak(c.intro);
  $('introGo').onclick = () => { SFX.tap(); startCase(id); };
  S.mode = 'intro'; screen('sIntro');
}
function newRun(c) { return { c, s: 0, clues: [], star: {}, qN: 0, qOk: 0, evN: 0, evOk: 0, due: [], caught: 0, started: false }; }
function startCase(id) { save.run = RUN = newRun(id - 1); persist(); screen(null); enterScene(0); }
function resumeCase() { RUN = save.run; RUN.due = RUN.due || []; RUN.star = RUN.star || {}; screen(null); enterScene(clamp(RUN.s, 0, 4)); }

$('menuBtn').onclick = () => { if (S.mode !== 'explore') return; SFX.tap(); S.mode = 'menu'; $('soundBtn').textContent = 'Sound: ' + (save.settings.sound ? 'on' : 'off'); screen('sMenu'); layoutSpots(); };
$('resumeBtn').onclick = () => { screen(null); S.mode = 'explore'; layoutSpots(); };
$('soundBtn').onclick = () => { save.settings.sound = !save.settings.sound; persist(); $('soundBtn').textContent = 'Sound: ' + (save.settings.sound ? 'on' : 'off'); };
$('quitBtn').onclick = () => { persist(); toTitle(); };

// Grown-ups: press and hold so a kid doesn't wander in by accident
(() => {
  const b = $('adultBtn'), fill = b.querySelector('i'); let t0 = 0, raf = 0;
  const stop = () => { cancelAnimationFrame(raf); t0 = 0; fill.style.width = '0'; };
  const tick = () => { const p = (performance.now() - t0) / 1100; fill.style.width = Math.min(100, p * 100) + '%'; if (p >= 1) { stop(); openAdult(); return; } raf = requestAnimationFrame(tick); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(tick); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAdult(); } });
})();
let resetArm = false;
function openAdult() {
  resetArm = false;
  const sk = save.skills;
  const pct = s => s && s.n ? Math.round(100 * s.ok / s.n) : null;
  const row = (label, s) => { const v = pct(s); return `<div class="skillrow"><span>${esc(label)}</span><div class="bar"><i class="${v == null ? '' : v < 60 ? 'lo' : v < 80 ? 'mid' : ''}" style="width:${v || 0}%"></i></div><span>${v == null ? '—' : `${v}% <small>(${s.ok}/${s.n})</small>`}</span></div>`; };
  const qById = {}; for (const c of CASES) for (const s of c.scenes) { for (const q of s.clue.qs) qById[q.id] = { q: q.q, skill: q.skill, cs: `${c.id}.${c.scenes.indexOf(s) + 1}` }; if (s.doors) qById[s.doors.id] = { q: s.doors.q, skill: s.doors.skill, cs: `${c.id}.${c.scenes.indexOf(s) + 1}` }; }
  const tricky = Object.entries(save.miss).filter(([id]) => (save.box[id] || 0) < 2).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id, n]) => {
    const base = id.replace(/:ev$/, ''), q = qById[base];
    return q ? `<li><b>${esc(q.cs)}</b> ${esc(q.q)} <small>(${esc(SKILLS[q.skill] || q.skill)}${id.endsWith(':ev') ? ', proof tap' : ''}; missed ${n}×)</small></li>` : '';
  }).join('');
  const days = Object.keys(save.days).length;
  const lv = save.settings.level;
  $('adultCard').innerHTML = `<h2>Grown-ups</h2>
    <p class="small" style="text-align:center;max-width:none">Showing <b>${esc(playerName(curPlayer()))}</b>. Each player has their own progress on this device.</p>
    <h3>Reading level</h3>
    <div class="chips">${[1, 2, 3].map(l => `<button class="chip ${lv === l ? 'on' : ''}" data-lv="${l}">${LEVELS[l].name}<small>${LEVELS[l].grade}, ${LEVELS[l].min}–${LEVELS[l].max} words</small></button>`).join('')}</div>
    <p class="small" style="max-width:none">Every passage has all three versions. The questions are the same at every level.</p>
    <h3>Reading help</h3>
    <div class="chips"><button class="chip ${save.settings.readAloud ? 'on' : ''}" id="raBtn">🔊 "Read it to me" button for whole passages: ${save.settings.readAloud ? 'ON' : 'OFF'}</button><button class="chip ${save.settings.sound ? 'on' : ''}" id="sndBtn">Sound effects: ${save.settings.sound ? 'ON' : 'OFF'}</button></div>
    <p class="small" style="max-width:none">Off by default, so the passage is his to read. Tapping a single word always says that word, and the questions and answers always have a 🔊 button. Speech needs a voice installed on the device.</p>
    <h3>First-try accuracy by skill</h3>
    ${Object.entries(SKILLS).map(([k, l]) => row(l, sk[k])).join('')}
    ${row('Finding proof (evidence taps)', sk.evidence)}
    <p class="small" style="max-width:none">Skills follow the Florida B.E.S.T. grade 3 reading standards. Door choices count as inference. A miss brings back a bonus question of the same skill later in the case when one is available.</p>
    <h3>Cases</h3>
    <p style="margin:4px 0;max-width:none;font-size:20px">${CASES.map(c => `Case ${c.id}: ${save.solved[c.id] ? '★'.repeat(save.solved[c.id]) + '☆'.repeat(3 - save.solved[c.id]) : c.id <= save.unlocked ? 'not solved yet' : 'locked'}`).join(' · ')}${days ? ` · played on ${days} day${days > 1 ? 's' : ''}` : ''}</p>
    ${tricky ? `<h3>Questions to revisit</h3><ul class="tricky">${tricky}</ul>` : ''}
    <div class="row"><button class="btn" id="adultBack">Done</button><button class="btn sm" id="resetBtn">Reset this player's progress</button></div>`;
  screen('sAdult');
  $('adultCard').querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { save.settings.level = +b.dataset.lv; persist(); openAdult(); });
  $('raBtn').onclick = () => { save.settings.readAloud = !save.settings.readAloud; persist(); openAdult(); };
  $('sndBtn').onclick = () => { save.settings.sound = !save.settings.sound; persist(); openAdult(); };
  $('adultBack').onclick = () => { refreshTitle(); screen('sTitle'); };
  $('resetBtn').onclick = () => {
    if (!resetArm) { resetArm = true; $('resetBtn').textContent = 'Tap again to erase everything for this player'; $('resetBtn').style.background = '#ff9a8a'; return; }
    const keep = { settings: save.settings, coat: save.coat }; save = Object.assign(fresh(), keep); persist(); openAdult();
  };
}

function openPlayers(editing = null) {
  const card = $('playersCard');
  card.innerHTML = `<h2>Who's playing?</h2><p class="small">Everyone gets their own cases, stars and reading level.</p>
    <div class="players">${P.list.map(pl => {
      const sv = pl.id === P.cur ? save : load(pl.id);
      const solved = Object.keys(sv.solved).length;
      return editing === pl.id
        ? `<div class="player on"><input id="pname" maxlength="14" value="${esc(pl.name)}" placeholder="${esc(playerName(pl))}" aria-label="Player name"><button class="btn sm" data-save="${pl.id}">Save</button></div>`
        : `<div class="player ${pl.id === P.cur ? 'on' : ''}"><button class="who" data-pick="${pl.id}">${pl.id === P.cur ? '▶ ' : ''}${esc(playerName(pl))}<small>${solved} case${solved === 1 ? '' : 's'} solved · ${LEVELS[sv.settings.level].name}</small></button><button class="btn sm" data-edit="${pl.id}" aria-label="Rename">✏️</button></div>`;
    }).join('')}</div>
    <h3>Raincoat color</h3>
    <div class="coats">${COATS.map(c => `<button class="coat ${save.coat === c ? 'on' : ''}" data-coat="${c}" style="background:${c}" aria-label="Raincoat color"></button>`).join('')}</div>
    <div class="row">${P.list.length < 6 ? '<button class="btn sm" data-a="add">➕ New player</button>' : ''}<button class="btn" data-a="back">Done</button></div>`;
  screen('sPlayers');
  const name = card.querySelector('#pname'); if (name) name.focus();
  card.onclick = e => {
    const b = e.target.closest('button'); if (!b) return; SFX.tap();
    if (b.dataset.pick) { if (b.dataset.pick !== P.cur) switchPlayer(b.dataset.pick); return openPlayers(); }
    if (b.dataset.edit) return openPlayers(b.dataset.edit);
    if (b.dataset.save) { const pl = P.list.find(x => x.id === b.dataset.save); pl.name = name.value.trim().slice(0, 14); savePlayers(); return openPlayers(); }
    if (b.dataset.coat) { save.coat = b.dataset.coat; persist(); return openPlayers(editing); }
    if (b.dataset.a === 'add') { let n = 2; while (P.list.some(x => x.id === 'p' + n)) n++; P.list.push({ id: 'p' + n, name: '' }); switchPlayer('p' + n); return openPlayers('p' + n); }
    if (b.dataset.a === 'back') { refreshTitle(); screen('sTitle'); }
  };
}
$('playerBtn').onclick = () => { SFX.tap(); openPlayers(); };

/* ---------- title scene ---------- */
function drawTitle() {
  sky('#0b0920', '#3a2a60', [300, 170]);
  // town skyline
  const houses = [[640, 260, 140], [790, 200, 110], [910, 300, 120], [1040, 230, 100], [1150, 280, 150], [1310, 220, 130]];
  for (const [x, h, w] of houses) { rr(x, FLOOR - h, w, h, 2, '#1c1636', INK, 4); poly([[x - 10, FLOOR - h], [x + w / 2, FLOOR - h - 60], [x + w + 10, FLOOR - h]], '#161130', INK, 4); for (let i = 0; i < 2; i++) rr(x + 18 + i * (w - 56), FLOOR - h + 40, 26, 34, 3, (i + x) % 3 ? '#ffcf4a' : '#2b2450'); }
  rr(980, 260, 90, 360, 2, '#211a3e', INK, 4); poly([[970, 262], [1025, 170], [1080, 262]], '#1a1434', INK, 4); circ(1025, 320, 30, '#f6ebcf', INK, 4); clockHands(1025, 320, 24);
  ground('#191428', '#241d38');
  for (let i = 0; i < 5; i++) { const bx = (S.t * 60 + i * 300) % (W + 200) - 100, by = 200 + Math.sin(S.t * 2 + i) * 30 + i * 30, f = Math.sin(S.t * 12 + i) * 10; poly([[bx, by], [bx - 26, by - 10 - f], [bx - 12, by], [bx + 12, by], [bx + 26, by - 10 - f]], '#0a0818'); }
  drawMumbles(560, 430 + Math.sin(S.t * 1.4) * 20, { a: .55, scale: .7 });
  drawKid(240, FLOOR, { coat: save.coat, face: 1, phase: 0 });
  drawWick(180, FLOOR - 250 + Math.sin(S.t * 3) * 8, 0, 1.15);
  darkness([[300, 170, 400], [310, FLOOR - 80, 560], [1025, 320, 160]], .35);
}

/* =====================================================================
   Main loop
   ===================================================================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000) * FAST; last = now; S.t += dt;
  if (S.mode === 'explore') updWorld(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0a0818'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * OX, DPR * OY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (S.mode === 'title' || S.mode === 'intro' || (S.mode === 'done')) drawTitle();
  else if (S.mode === 'unmask') drawUnmask(dt);
  else drawWorld();
  ctx.restore();
  drawWickFace();
  requestAnimationFrame(loop);
}
resize(); refreshTitle(); requestAnimationFrame(loop);

/* =====================================================================
   Debug hooks: ?debug exposes window.__cw; ?test= stages each mechanic.
   ===================================================================== */
if (DEBUG) {
  const loadCase = n => { screen(null); hideClue(); $('board').classList.remove('on'); save.unlocked = Math.max(save.unlocked, n); save.sel = n; startCase(n); };
  const scene = n => { if (!RUN) loadCase(1); hideClue(); RUN.clues = caseData().scenes.slice(0, n - 1).map(s => s.id); enterScene(n - 1); };
  window.__cw = {
    get S() { return S; }, get save() { return save; }, get RUN() { return RUN; }, get WORLD() { return WORLD; }, get Q() { return CUR; },
    CASES, LEVELS, loadCase, scene, openBoard, unmask, toTitle, openAdult,
    set fast(v) { FAST = v; }, get fast() { return FAST; },
    spotXY(id) { const el = document.querySelector(`[data-spot="${id}"]`); if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
    get said() { return lastSaid; },
  };
  const t = QS.get('test');
  const openFirst = () => { loadCase(1); return openSceneClue(); };
  if (t === 'read') openFirst();
  if (t === 'evidence') { loadCase(1); S.mode = 'card'; showClue(WORLD.sc); askEvidence(WORLD.sc.clue.qs.find(q => q.ev), 'Question 2 of 3'); }
  if (t === 'order') { loadCase(1); scene(3); S.mode = 'card'; showClue(WORLD.sc); askOrder(WORLD.sc.clue.qs.find(q => q.type === 'order'), 'Question 1 of 3'); }
  if (t === 'doors') { loadCase(1); scene(2); WORLD.earned = true; RUN.clues.push(WORLD.sc.id); WORLD.px = WORLD.tx = 560; WORLD.doorAsk = true; showDoorBar(); layoutSpots(); }
  if (t === 'board') { loadCase(1); RUN.clues = caseData().scenes.map(s => s.id); RUN.star = { c1s1: true, c1s3: true }; openBoard(); }
  if (t === 'unmask') { loadCase(1); unmask(); }
  if (t === 'lamp') { loadCase(2); WORLD.cr.t = 1; }
  if (t === 'tock') { loadCase(3); WORLD.cr.t = 1; }
}
</script>
</body>
</html>
